name: Java CI

on:
  pull_request:
    branches: [devel]
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package and run tests
        run: mvn -B -ntp package

      - name: Read Maven coordinates
        id: project
        shell: bash
        run: |
          set -euo pipefail
          coordinates=$(python3 scripts/read-maven-coordinates.py)
          artifact_id=$(printf '%s\n' "$coordinates" | sed -n '1p')
          version=$(printf '%s\n' "$coordinates" | sed -n '2p')
          [[ -n "$artifact_id" && -n "$version" && "$coordinates" != *$'\n'*$'\n'* ]]
          [[ "$artifact_id" == "miku-md2html-java" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          runtime_jar="target/${artifact_id}-${version}.jar"
          source_jar="target/${artifact_id}-${version}-sources.jar"
          [[ -s "$runtime_jar" && -s "$source_jar" ]]
          jar tf "$runtime_jar" | grep -Fx 'jp/igapyon/mikumd2html/cli/MikuMd2htmlCli.class'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime_jar=$runtime_jar" >> "$GITHUB_OUTPUT"
          echo "runtime_sha256=$(sha256sum "$runtime_jar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Smoke packaged JAR on Java 8
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '8'
        # Keep the just-built artifact; this step changes only JAVA_HOME/PATH.
      - name: Verify packaged runtime on Java 8
        run: bash scripts/smoke-packaged-runtime.sh "${{ steps.project.outputs.runtime_jar }}" "${{ steps.project.outputs.version }}"

      - name: Smoke same packaged JAR on Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify identical packaged runtime on Java 25
        run: |
          echo "Runtime JAR SHA-256: ${{ steps.project.outputs.runtime_sha256 }}"
          bash scripts/smoke-packaged-runtime.sh "${{ steps.project.outputs.runtime_jar }}" "${{ steps.project.outputs.version }}"
